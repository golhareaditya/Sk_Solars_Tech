<style>

  .sk-navbar .navbar-brand img {

  }

  .sk-navbar .nav-link {

    padding: 0.72rem 1.05rem !important;

  }

  .sk-navbar .nav-link:hover,
  .sk-navbar .nav-link:focus,

  .sk-navbar .sk-language-item {

  }

  .sk-navbar .sk-language-btn {

    align-items: center;
    gap: 0.45rem;

    border-radius: 999px;

    font-weight: 700;

  .sk-navbar .sk-language-btn:hover,

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const languageItem = document.querySelector('.sk-language-item');

    if (!languageItem) {
      return;
    }

    const languageButton = languageItem.querySelector('.sk-language-btn');
    const languageLabel = languageItem.querySelector('.sk-language-label');
    const languageOptions = languageItem.querySelectorAll('.sk-language-option');
    const defaultSourceLanguage = 'en';

    const setMenuState = (isOpen) => {
      languageItem.classList.toggle('is-open', isOpen);
      languageButton.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    };

    const setLanguageCookie = (lang) => {
      const cookieValue = '/' + defaultSourceLanguage + '/' + lang;
      document.cookie = 'googtrans=' + cookieValue + '; path=/';
      document.cookie = 'googtrans=' + cookieValue + '; path=/; domain=' + window.location.hostname;
    };

    const getSavedLanguage = () => {
      const match = document.cookie.match(/(?:^|;)\s*googtrans=\/[^/]+\/([^;]+)/);
      return match ? match[1] : defaultSourceLanguage;
    };

    const updateActiveLanguage = (lang) => {
      let activeLabel = 'English';

      languageOptions.forEach(function (option) {
        const isActive = option.dataset.lang === lang;
        option.classList.toggle('is-active', isActive);

        if (isActive) {
          activeLabel = option.dataset.label || activeLabel;
        }
      });

      languageLabel.textContent = activeLabel;
    };

    const applyLanguage = (lang) => {
      updateActiveLanguage(lang);
      setLanguageCookie(lang);
      window.location.reload();
    };

    languageButton.addEventListener('click', function (event) {
      event.stopPropagation();
      setMenuState(!languageItem.classList.contains('is-open'));
    });

    languageOptions.forEach(function (option) {
      option.addEventListener('click', function () {
        const selectedLanguage = option.dataset.lang || defaultSourceLanguage;
        setMenuState(false);
        applyLanguage(selectedLanguage);
      });
    });

    document.addEventListener('click', function (event) {
      if (!languageItem.contains(event.target)) {
        setMenuState(false);
      }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        setMenuState(false);
      }
    });

    updateActiveLanguage(getSavedLanguage());
  });
</script>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement(
      {
        pageLanguage: 'en',
        includedLanguages: 'en,hi,mr',
        autoDisplay: false
      },
      'google_translate_element'
    );
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
